services:
  spring:
    build:
      context: .
    container_name: gmss-spring
    environment:
      - CORS_ORIGINS=https://gmss.site,https://www.gmss.site,https://testchat-alpha.vercel.app
      - FRONTEND_BASE_URL=https://www.gmss.site
      # 필요하면 여기서 DB/testchatpy base-url도 환경변수로 주입(프로젝트 설정에 맞게)
    restart: always
    networks: [gmss]

  nginx:
    image: nginx:1.27-alpine
    container_name: gmss-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on: [spring]
    restart: always
    networks: [gmss]

networks:
  gmss:
    driver: bridge
