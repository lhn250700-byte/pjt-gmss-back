spring.security.oauth2.client.registration.kakao.client-secret=NcLc5uPCtDjEA8dixgMsm3UntN6dywp2
# 인증 서버로 요청 시 지정할 요청 메소드
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
# 액세스 토큰 요청 시 유형을 지정하는 헤더 속성
